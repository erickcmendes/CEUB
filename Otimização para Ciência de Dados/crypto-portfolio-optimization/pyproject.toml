[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio_opt"
version = "0.1.0"
description = "Mathematical optimization and metaheuristics for cryptocurrency portfolio selection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Erick Mendes"}
]
dependencies = [
    "pyomo>=6.8.0",
    "scipy>=1.12.0",
    "deap>=1.4.1",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "yfinance>=0.2.36"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

