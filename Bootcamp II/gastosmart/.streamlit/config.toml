# Tema visual do GastoSmart
# Apenas a cor primaria e fixada (verde da marca #1a6b2e).
# O restante (light/dark, backgrounds, cor de texto) e deixado adaptativo
# para respeitar a preferencia do sistema/usuario.
#
# Doc: https://docs.streamlit.io/develop/concepts/configuration/theming

[theme]
primaryColor = "#1a6b2e"

[browser]
gatherUsageStats = false

[server]
headless = true
