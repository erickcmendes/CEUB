# =============================================================================
# AV3 - Pipeline de Dados Air Quality
# Lote:      MinIO (CSV) -> Kafka -> Spark -> Delta Lake Bronze/Silver/Gold (MinIO)
#            -> Cassandra -> FastAPI (+ cache Redis) -> Streamlit
# Contínuo:  simulador -> Kafka -> Spark Structured Streaming -> Cassandra/Kafka
#            (perfil "streaming": docker compose --profile streaming up -d)
# Orquestracao: Apache Airflow (LocalExecutor)
#
# mem_limit: a máquina de desenvolvimento tem 2 vCPUs / 8 GB. Os limites fazem um
# estouro de memória derrubar só o processo daquele contêiner (com retry), em vez de
# esgotar a VM inteira.
#
# Todos os servicos compartilham a rede externa "mybridge" (criada por
# scripts/setup.sh), seguindo o padrao dos laboratorios da disciplina.
# =============================================================================

x-airflow-common: &airflow-common
  build:
    context: ./airflow
  image: av3-airflow:2.10.3
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    # Conexao usada pelo SparkSubmitOperator (driver em modo client)
    # Formato JSON: na forma URI o provider descarta o esquema spark:// do host
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077, "extra": {"deploy-mode": "client"}}'
    PYTHONPATH: /opt/airflow/jobs
  volumes:
    - ./dags:/opt/airflow/dags
    - ./jobs:/opt/airflow/jobs
    - ./cassandra:/opt/airflow/cassandra
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - mybridge
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  # Armazenamento de objetos (Data Lake S3-compatível)
  # ---------------------------------------------------------------------------
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio
    mem_limit: 384m
    restart: unless-stopped
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mybridge

  # ---------------------------------------------------------------------------
  # Kafka em modo KRaft (sem ZooKeeper), 1 broker
  # ---------------------------------------------------------------------------
  kafka1:
    image: apache/kafka:3.8.0
    container_name: kafka1
    mem_limit: 640m
    restart: unless-stopped
    hostname: kafka1
    environment:
      CLUSTER_ID: "av3-airquality-kraft-01"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topicos so existem se criados explicitamente (tarefa create_kafka_topic)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    ports:
      - "29092:29092"  # acesso a partir do host
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka1:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - mybridge

  # ---------------------------------------------------------------------------
  # Spark Standalone: 1 master + 1 worker
  # O driver roda no contêiner do Airflow (deploy-mode client) e os
  # executores rodam no worker.
  # ---------------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    container_name: spark-master
    mem_limit: 512m
    restart: unless-stopped
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_DAEMON_MEMORY: 256m
    ports:
      - "8081:8080"   # Spark Master UI
      - "7077:7077"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/spark-master/7077'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mybridge

  spark-worker:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    container_name: spark-worker
    mem_limit: 1600m
    restart: unless-stopped
    hostname: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_DAEMON_MEMORY: 256m
      # 3 cores / 1,5 GB: 2 cores para os jobs em lote + 1 para o streaming
      SPARK_WORKER_CORES: "3"
      SPARK_WORKER_MEMORY: 1536m
    ports:
      - "8082:8081"   # Spark Worker UI
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - mybridge

  # ---------------------------------------------------------------------------
  # Camada de serviço: Cassandra (consultas), Redis (cache), API e dashboard
  # ---------------------------------------------------------------------------
  cassandra:
    image: cassandra:4.1.7
    container_name: cassandra
    mem_limit: 900m
    hostname: cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: av3-airquality
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 320M
      HEAP_NEWSIZE: 80M
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks:
      - mybridge

  redis:
    image: redis:7.4-alpine
    container_name: redis
    mem_limit: 96m
    restart: unless-stopped
    hostname: redis
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - mybridge

  api:
    build:
      context: ./api
    image: av3-api:1.0
    container_name: api
    mem_limit: 256m
    hostname: api
    environment:
      CASSANDRA_HOST: cassandra
      REDIS_HOST: redis
      CACHE_TTL_SECONDS: "600"
    volumes:
      - ./jobs/alert_rules.py:/app/shared/alert_rules.py:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mybridge

  dashboard:
    build:
      context: ./dashboard
    image: av3-dashboard:1.0
    container_name: dashboard
    mem_limit: 384m
    hostname: dashboard
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mybridge

  # ---------------------------------------------------------------------------
  # Processamento contínuo (opcional): simulador de sensor + Spark Streaming
  # ---------------------------------------------------------------------------
  sensor-simulator:
    image: av3-airflow:2.10.3
    container_name: sensor-simulator
    mem_limit: 256m
    profiles: ["streaming"]
    env_file: .env
    environment:
      PYTHONPATH: /opt/airflow/jobs
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - ./jobs:/opt/airflow/jobs:ro
    command: ["python", "/opt/airflow/jobs/sensor_simulator.py", "--rate", "2", "--start-line", "6100"]
    depends_on:
      spark-streaming:
        condition: service_started
    restart: unless-stopped
    networks:
      - mybridge

  spark-streaming:
    image: av3-airflow:2.10.3
    container_name: spark-streaming
    mem_limit: 1g
    hostname: spark-streaming
    profiles: ["streaming"]
    env_file: .env
    environment:
      PYTHONPATH: /opt/airflow/jobs
      CASSANDRA_SCHEMA_FILE: /opt/airflow/cassandra/schema.cql
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - ./jobs:/opt/airflow/jobs:ro
      - ./cassandra:/opt/airflow/cassandra:ro
    command:
      - bash
      - -c
      - >-
        spark-submit --master spark://spark-master:7077
        --jars $$(ls /opt/spark-jars/*.jar | paste -sd, -)
        --conf spark.driver.host=spark-streaming --conf spark.driver.bindAddress=0.0.0.0
        --conf spark.cores.max=1 --conf spark.executor.cores=1
        --conf spark.executor.memory=512m --conf spark.driver.memory=512m
        --conf spark.sql.shuffle.partitions=2
        --name av3-stream-serving /opt/airflow/jobs/stream_serving_job.py
    depends_on:
      spark-master:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      kafka1:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mybridge

  # ---------------------------------------------------------------------------
  # Airflow: metadados (Postgres), init, webserver e scheduler
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:13
    container_name: airflow-postgres
    mem_limit: 256m
    restart: unless-stopped
    hostname: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mybridge

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    # Mantém o entrypoint oficial (ele registra o AIRFLOW_UID no /etc/passwd)
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        if airflow users list | grep -qw "$${_AIRFLOW_WWW_USER_USERNAME}"; then
          echo "Usuário $${_AIRFLOW_WWW_USER_USERNAME} já existe"
        else
          airflow users create --username "$${_AIRFLOW_WWW_USER_USERNAME}" --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
            --firstname Admin --lastname AV3 --role Admin --email admin@example.com
        fi
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    mem_limit: 800m
    hostname: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    mem_limit: 1600m
    # Hostname fixo: os executores Spark se conectam de volta ao driver
    # (que roda aqui, pois o LocalExecutor executa as tarefas no scheduler).
    hostname: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      kafka1:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  mybridge:
    name: mybridge
    external: true

volumes:
  minio-data:
  kafka-data:
  postgres-db:
  cassandra-data:
